[project]
name = "multimodel-rag-docling"
version = "0.1.0"
description = "Multimodal RAG over complex PDFs using Docling, Qdrant, and OpenRouter"
requires-python = ">=3.10"
dependencies = [
    "docling",
    "qdrant-client",
    "pinecone",
    "streamlit",
    "fastapi",
    "uvicorn",
    "openai",
    "tiktoken",
    "python-dotenv",
    "Pillow",
    "python-multipart>=0.0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = []
